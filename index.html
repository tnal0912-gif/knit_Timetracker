<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧶 뜨개 타임 트래커</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #fdf6f0;
    color: #3d2b1f;
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    text-align: center;
    font-size: 1.2rem;
    color: #8b5e52;
    margin-bottom: 18px;
    letter-spacing: 0.05em;
  }
  .timer-box {
    background: #fff;
    border-radius: 16px;
    padding: 24px 20px;
    box-shadow: 0 2px 12px rgba(139,94,82,0.1);
    margin-bottom: 16px;
    text-align: center;
  }
  .project-input {
    width: 100%;
    padding: 8px 12px;
    border: 1.5px solid #e8d5c4;
    border-radius: 8px;
    font-size: 0.9rem;
    margin-bottom: 16px;
    color: #3d2b1f;
    background: #fdf6f0;
    outline: none;
  }
  .project-input:focus { border-color: #c9896e; }
  .display {
    font-size: 3rem;
    font-weight: 700;
    color: #c9896e;
    letter-spacing: 0.05em;
    margin-bottom: 20px;
    font-variant-numeric: tabular-nums;
  }
  .btn-row {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  button {
    padding: 10px 22px;
    border: none;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-start {
    background: #c9896e;
    color: #fff;
  }
  .btn-start:hover { background: #b5755b; }
  .btn-stop {
    background: #e8d5c4;
    color: #8b5e52;
  }
  .btn-stop:hover { background: #d4b99e; }
  .btn-reset {
    background: #f5ede6;
    color: #b5856e;
    font-size: 0.8rem;
    padding: 10px 14px;
  }
  .btn-save {
    background: #a8c5a0;
    color: #fff;
  }
  .btn-save:hover { background: #8fb389; }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .status {
    font-size: 0.8rem;
    color: #b5856e;
    margin-top: 10px;
    min-height: 18px;
  }
  .records-box {
    background: #fff;
    border-radius: 16px;
    padding: 18px 16px;
    box-shadow: 0 2px 12px rgba(139,94,82,0.08);
  }
  .records-box h2 {
    font-size: 0.95rem;
    color: #8b5e52;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .clear-btn {
    font-size: 0.72rem;
    color: #c9a090;
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 6px;
    font-weight: 400;
  }
  .record-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    border-radius: 8px;
    background: #fdf6f0;
    margin-bottom: 6px;
    font-size: 0.83rem;
  }
  .record-project { color: #5a3e35; font-weight: 600; }
  .record-meta { color: #a07060; font-size: 0.76rem; margin-top: 2px; }
  .record-time { color: #c9896e; font-weight: 700; font-size: 0.9rem; }
  .empty { color: #c9a090; font-size: 0.82rem; text-align: center; padding: 12px 0; }
  .today-total {
    text-align: center;
    font-size: 0.8rem;
    color: #8b5e52;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed #e8d5c4;
  }
  .today-total span { font-weight: 700; color: #c9896e; }
</style>
</head>
<body>
<h1>🧶 뜨개 타임 트래커</h1>

<div class="timer-box">
  <input class="project-input" id="projectName" placeholder="프로젝트 이름을 입력하세요" />
  <div class="display" id="display">00:00:00</div>
  <div class="btn-row">
    <button class="btn-start" id="btnStart" onclick="startTimer()">▶ 시작</button>
    <button class="btn-stop" id="btnStop" onclick="stopTimer()" disabled>⏸ 일시정지</button>
    <button class="btn-save" id="btnSave" onclick="saveRecord()" disabled>💾 저장</button>
    <button class="btn-reset" onclick="resetTimer()">↺</button>
  </div>
  <div class="status" id="status"></div>
</div>

<div class="records-box">
  <h2>📋 오늘의 기록 <button class="clear-btn" onclick="clearRecords()">전체 삭제</button></h2>
  <div id="recordList"><div class="empty">아직 기록이 없어요 🪡</div></div>
  <div class="today-total" id="todayTotal" style="display:none">
    오늘 총 뜨개 시간: <span id="totalTime">0시간 0분</span>
  </div>
</div>

<script>
let startTime = null, elapsed = 0, timerInterval = null, running = false;
let records = JSON.parse(localStorage.getItem('knit_records') || '[]');
const today = new Date().toLocaleDateString('ko-KR');

function fmt(ms) {
  const s = Math.floor(ms / 1000);
  const h = String(Math.floor(s / 3600)).padStart(2, '0');
  const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
  const sec = String(s % 60).padStart(2, '0');
  return `${h}:${m}:${sec}`;
}

function startTimer() {
  if (running) return;
  running = true;
  startTime = Date.now() - elapsed;
  timerInterval = setInterval(() => {
    elapsed = Date.now() - startTime;
    document.getElementById('display').textContent = fmt(elapsed);
  }, 500);
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnStop').disabled = false;
  document.getElementById('btnSave').disabled = false;
  document.getElementById('status').textContent = '⏱ 뜨개 중...';
}

function stopTimer() {
  if (!running) return;
  running = false;
  clearInterval(timerInterval);
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnStop').disabled = true;
  document.getElementById('status').textContent = '⏸ 일시정지됨 — 이어서 시작하거나 저장하세요';
}

function resetTimer() {
  running = false;
  clearInterval(timerInterval);
  elapsed = 0;
  document.getElementById('display').textContent = '00:00:00';
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnStop').disabled = true;
  document.getElementById('btnSave').disabled = true;
  document.getElementById('status').textContent = '';
}

function saveRecord() {
  stopTimer();
  if (elapsed < 1000) { alert('1초 이상 기록해야 저장할 수 있어요!'); return; }
  const proj = document.getElementById('projectName').value.trim() || '프로젝트 미입력';
  const now = new Date();
  const rec = {
    project: proj,
    date: today,
    time: now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }),
    ms: elapsed,
    display: fmt(elapsed)
  };
  records.unshift(rec);
  localStorage.setItem('knit_records', JSON.stringify(records));
  renderRecords();
  resetTimer();
  document.getElementById('status').textContent = '✅ 저장 완료!';
}

function clearRecords() {
  if (!confirm('오늘 기록을 모두 삭제할까요?')) return;
  records = records.filter(r => r.date !== today);
  localStorage.setItem('knit_records', JSON.stringify(records));
  renderRecords();
}

function renderRecords() {
  const todayRecs = records.filter(r => r.date === today);
  const list = document.getElementById('recordList');
  if (todayRecs.length === 0) {
    list.innerHTML = '<div class="empty">아직 기록이 없어요 🪡</div>';
    document.getElementById('todayTotal').style.display = 'none';
    return;
  }
  list.innerHTML = todayRecs.map(r => `
    <div class="record-item">
      <div>
        <div class="record-project">🧶 ${r.project}</div>
        <div class="record-meta">${r.date} ${r.time}</div>
      </div>
      <div class="record-time">${r.display}</div>
    </div>
  `).join('');
  const totalMs = todayRecs.reduce((a, r) => a + r.ms, 0);
  const th = Math.floor(totalMs / 3600000);
  const tm = Math.floor((totalMs % 3600000) / 60000);
  document.getElementById('totalTime').textContent = `${th}시간 ${tm}분`;
  document.getElementById('todayTotal').style.display = 'block';
}

renderRecords();
</script>
</body>
</html>
